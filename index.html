<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Anatomía Interactiva</title>
<style>
:root{--bg:#0f172a;--card:#111827;--ink:#e5e7eb;--muted:#9ca3af;--accent:#38bdf8;--good:#22c55e;--bad:#fb7185;--line:#243044}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at 20% 0%,#1e3a8a 0,#0f172a 35%,#070b14 100%);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:rgba(7,11,20,.86);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:clamp(22px,3vw,38px);margin:0}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#0b1220;color:var(--muted)}
main{max-width:1220px;margin:auto;padding:24px}.panel{background:rgba(17,24,39,.78);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 22px 70px rgba(0,0,0,.28);margin-bottom:18px}
.controls{display:grid;grid-template-columns:1fr 220px 160px 130px;gap:10px}.controls input,.controls select,.controls button,button{background:#0b1220;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:15px}button{cursor:pointer}button:hover{border-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#0b1220;border:1px solid var(--line);border-radius:18px;padding:14px}.stat b{display:block;font-size:24px;color:white}.stat span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.card{background:#0b1220;border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:.2s;position:relative}.card:hover{transform:translateY(-3px);border-color:#334155}.card img{width:100%;height:245px;object-fit:contain;background:#fff;display:block}.meta{padding:12px}.meta h3{margin:0 0 6px;font-size:16px}.meta p{margin:4px 0;color:var(--muted);font-size:13px}.tag{display:inline-block;color:#082f49;background:#7dd3fc;border-radius:999px;padding:4px 9px;font-size:12px;margin-top:6px}
.study{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}.stage{background:white;border-radius:22px;overflow:hidden;min-height:520px;display:flex;align-items:center;justify-content:center;position:relative}.stage img{max-width:100%;max-height:78vh;transform-origin:center;transition:.2s}.side h2{margin-top:0}.answer{padding:14px;border:1px dashed #334155;border-radius:16px;margin:12px 0;color:var(--muted)}.hidden{filter:blur(7px);opacity:.55}.row{display:flex;gap:8px;flex-wrap:wrap}.good{color:var(--good)}.bad{color:var(--bad)}
.flash{perspective:1000px}.flashInner{min-height:180px;transition:transform .5s;transform-style:preserve-3d}.flash.flipped .flashInner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:#0b1220;border:1px solid var(--line);border-radius:20px;padding:18px}.back{transform:rotateY(180deg)}
footer{color:var(--muted);font-size:12px;padding:20px;text-align:center}@media(max-width:850px){.controls,.study,.stats{grid-template-columns:1fr}.stage{min-height:360px}}
</style>
</head>
<body>
<header><div><h1>🧠 Anatomía Interactiva</h1><div class="pill">Galería + modo estudio + quiz rápido</div></div><div class="pill" id="countPill"></div></header>
<main>
<section class="panel">
<div class="controls">
<input id="search" placeholder="Buscar: cráneo, riñón, músculo..." />
<select id="topic"><option value="">Todos los temas</option></select>
<select id="mode"><option value="gallery">Galería</option><option value="study">Modo estudio</option><option value="quiz">Quiz</option></select>
<button id="shuffle">Barajar</button>
</div>
</section>
<section class="panel stats">
<div class="stat"><b id="total">0</b><span>imágenes</span></div><div class="stat"><b id="seen">0</b><span>vistas</span></div><div class="stat"><b id="ok">0</b><span>aciertos</span></div><div class="stat"><b id="pct">0%</b><span>precisión</span></div>
</section>
<section id="app"></section>
</main><footer>Hecho para repasar por sistemas. Pulsa “Lo sabía” o “Repasar” para guardar progreso en este navegador.</footer>
<script>
const ITEMS = [{"id": 1, "title": "Riñón con etiquetas vacías", "source": "Examen enero", "page": 2, "img": "assets/img_01.jpg", "topic": "Sistema urinario"}, {"id": 2, "title": "Riñón y nefrona", "source": "Examen enero", "page": 3, "img": "assets/img_02.jpg", "topic": "Sistema urinario"}, {"id": 3, "title": "Riñón para completar", "source": "Examen enero", "page": 4, "img": "assets/img_03.jpg", "topic": "Sistema urinario"}, {"id": 4, "title": "Corte sagital de cabeza", "source": "Examen enero", "page": 5, "img": "assets/img_04.jpg", "topic": "Cabeza y cuello"}, {"id": 5, "title": "Corte sagital de cabeza", "source": "Examen enero", "page": 6, "img": "assets/img_05.jpg", "topic": "Cabeza y cuello"}, {"id": 6, "title": "Corte sagital de cabeza numerado", "source": "Examen enero", "page": 8, "img": "assets/img_06.jpg", "topic": "Cabeza y cuello"}, {"id": 7, "title": "Riñón y nefrona", "source": "Examen enero", "page": 9, "img": "assets/img_07.jpg", "topic": "Sistema urinario"}, {"id": 8, "title": "Vértebras y sacro", "source": "Cuaderno anatomía", "page": 2, "img": "assets/img_08.jpg", "topic": "Columna y tronco óseo"}, {"id": 9, "title": "Columna y caja torácica", "source": "Cuaderno anatomía", "page": 3, "img": "assets/img_09.jpg", "topic": "Columna y tronco óseo"}, {"id": 10, "title": "Columna vertebral numerada", "source": "Cuaderno anatomía", "page": 4, "img": "assets/img_10.jpg", "topic": "Columna y tronco óseo"}, {"id": 11, "title": "Musculatura espalda", "source": "Cuaderno anatomía", "page": 5, "img": "assets/img_11.jpg", "topic": "Sistema muscular"}, {"id": 12, "title": "Músculos tronco", "source": "Cuaderno anatomía", "page": 6, "img": "assets/img_12.jpg", "topic": "Sistema muscular"}, {"id": 13, "title": "Cráneo", "source": "Cuaderno anatomía", "page": 7, "img": "assets/img_13.jpg", "topic": "Cabeza y cuello"}, {"id": 14, "title": "Cráneo posterior y superior", "source": "Cuaderno anatomía", "page": 8, "img": "assets/img_14.jpg", "topic": "Cabeza y cuello"}, {"id": 15, "title": "Base del cráneo", "source": "Cuaderno anatomía", "page": 9, "img": "assets/img_15.jpg", "topic": "Cabeza y cuello"}, {"id": 16, "title": "Miembro inferior huesos", "source": "Cuaderno anatomía", "page": 10, "img": "assets/img_16.jpg", "topic": "Osteología de miembros"}, {"id": 17, "title": "Muslos y glúteos", "source": "Cuaderno anatomía", "page": 11, "img": "assets/img_17.jpg", "topic": "Sistema muscular"}, {"id": 18, "title": "Pierna", "source": "Cuaderno anatomía", "page": 12, "img": "assets/img_18.jpg", "topic": "Sistema muscular"}, {"id": 19, "title": "Miembro superior huesos", "source": "Cuaderno anatomía", "page": 13, "img": "assets/img_19.jpg", "topic": "Osteología de miembros"}, {"id": 20, "title": "Hombro y brazo", "source": "Cuaderno anatomía", "page": 14, "img": "assets/img_20.jpg", "topic": "Sistema muscular"}, {"id": 21, "title": "Antebrazo", "source": "Cuaderno anatomía", "page": 15, "img": "assets/img_21.jpg", "topic": "Sistema muscular"}, {"id": 22, "title": "Cráneo vistas lateral y frontal", "source": "Todas imágenes examen", "page": 2, "img": "assets/img_22.jpg", "topic": "Cabeza y cuello"}, {"id": 23, "title": "Base del cráneo", "source": "Todas imágenes examen", "page": 3, "img": "assets/img_23.jpg", "topic": "Cabeza y cuello"}, {"id": 24, "title": "Músculos cabeza y cuello", "source": "Todas imágenes examen", "page": 4, "img": "assets/img_24.jpg", "topic": "Cabeza y cuello"}, {"id": 25, "title": "Músculos cabeza con etiquetas vacías", "source": "Todas imágenes examen", "page": 5, "img": "assets/img_25.jpg", "topic": "Cabeza y cuello"}, {"id": 26, "title": "Etmoides y articulaciones", "source": "Todas imágenes examen", "page": 6, "img": "assets/img_26.jpg", "topic": "Cabeza y cuello"}, {"id": 27, "title": "Articulaciones y corazón", "source": "Todas imágenes examen", "page": 7, "img": "assets/img_27.jpg", "topic": "Sistema cardiovascular"}, {"id": 28, "title": "Vértebras resumen", "source": "Todas imágenes examen", "page": 8, "img": "assets/img_28.jpg", "topic": "Columna y tronco óseo"}, {"id": 29, "title": "Atlas y axis", "source": "Todas imágenes examen", "page": 9, "img": "assets/img_29.jpg", "topic": "Columna y tronco óseo"}, {"id": 30, "title": "Arterias tórax/abdomen", "source": "Todas imágenes examen", "page": 10, "img": "assets/img_30.jpg", "topic": "Sistema cardiovascular"}, {"id": 31, "title": "Arterias cuerpo completo", "source": "Todas imágenes examen", "page": 11, "img": "assets/img_31.jpg", "topic": "Sistema cardiovascular"}, {"id": 32, "title": "Venas tórax/abdomen", "source": "Todas imágenes examen", "page": 12, "img": "assets/img_32.jpg", "topic": "Sistema cardiovascular"}, {"id": 33, "title": "Venas cuerpo completo", "source": "Todas imágenes examen", "page": 13, "img": "assets/img_33.jpg", "topic": "Sistema cardiovascular"}, {"id": 34, "title": "Músculos tronco", "source": "Todas imágenes examen", "page": 14, "img": "assets/img_34.jpg", "topic": "Sistema muscular"}, {"id": 35, "title": "Musculatura espalda etiquetas vacías", "source": "Todas imágenes examen", "page": 15, "img": "assets/img_35.jpg", "topic": "Sistema muscular"}, {"id": 36, "title": "Miembro inferior huesos etiquetas vacías", "source": "Todas imágenes examen", "page": 16, "img": "assets/img_36.jpg", "topic": "Osteología de miembros"}, {"id": 37, "title": "Glúteos y pierna anterior", "source": "Todas imágenes examen", "page": 17, "img": "assets/img_37.jpg", "topic": "Sistema muscular"}, {"id": 38, "title": "Muslo etiquetas vacías", "source": "Todas imágenes examen", "page": 18, "img": "assets/img_38.jpg", "topic": "Sistema muscular"}, {"id": 39, "title": "Pierna posterior/lateral", "source": "Todas imágenes examen", "page": 19, "img": "assets/img_39.jpg", "topic": "Sistema muscular"}, {"id": 40, "title": "Mano huesos", "source": "Todas imágenes examen", "page": 20, "img": "assets/img_40.jpg", "topic": "Osteología de miembros"}];
let state = JSON.parse(localStorage.getItem('anatState')||'{"seen":{},"ok":0,"bad":0}');
let current = 0, zoom = 1, order = [...ITEMS];
const $=id=>document.getElementById(id);
const topics=[...new Set(ITEMS.map(x=>x.topic))].sort(); topics.forEach(t=>$('topic').insertAdjacentHTML('beforeend',`<option>${t}</option>`));
function save(){localStorage.setItem('anatState',JSON.stringify(state));stats()}
function stats(){let s=Object.keys(state.seen||{}).length, ok=state.ok||0, bad=state.bad||0; $('total').textContent=ITEMS.length;$('seen').textContent=s;$('ok').textContent=ok;$('pct').textContent=(ok+bad?Math.round(ok/(ok+bad)*100):0)+'%';$('countPill').textContent=`${filtered().length} visibles de ${ITEMS.length}`}
function filtered(){let q=$('search').value.toLowerCase(), t=$('topic').value; return order.filter(x=>(!t||x.topic===t)&&(`${x.title} ${x.topic} ${x.source}`.toLowerCase().includes(q)))}
function render(){stats(); const mode=$('mode').value; if(mode==='study') return renderStudy(); if(mode==='quiz') return renderQuiz(); renderGallery()}
function renderGallery(){const list=filtered(); $('app').innerHTML=`<div class="grid">${list.map(x=>`<article class="card"><img src="${x.img}" loading="lazy"><div class="meta"><h3>${x.title}</h3><p>${x.source}, pág. ${x.page}</p><span class="tag">${x.topic}</span></div></article>`).join('')}</div>`}
function pick(){let list=filtered(); if(!list.length) return null; current=(current+list.length)%list.length; return list[current%list.length]}
function renderStudy(){const x=pick(); if(!x){$('app').innerHTML='<div class="panel">No hay resultados.</div>';return} state.seen[x.id]=true; save(); zoom=1; $('app').innerHTML=`<div class="study panel"><div class="stage"><img id="big" src="${x.img}"></div><aside class="side"><h2>${x.title}</h2><p class="tag">${x.topic}</p><p>${x.source}, página ${x.page}</p><div class="answer" id="hint">Antes de mirar la respuesta: nombra 3 estructuras visibles y su orientación.</div><div class="row"><button onclick="prev()">Anterior</button><button onclick="next()">Siguiente</button><button onclick="zoomImg(1.15)">Zoom +</button><button onclick="zoomImg(.87)">Zoom -</button></div><div class="row" style="margin-top:10px"><button onclick="mark(true)" class="good">Lo sabía</button><button onclick="mark(false)" class="bad">Repasar</button></div><hr style="border-color:#243044"><h3>Mini-guía</h3><p>1. Localiza región. 2. Di plano/vista. 3. Nombra estructuras grandes. 4. Baja a detalles. El mapa anatómico se conquista por capas, no a martillazos.</p></aside></div>`}
function renderQuiz(){const x=filtered()[Math.floor(Math.random()*filtered().length)]||ITEMS[0]; state.seen[x.id]=true; save(); $('app').innerHTML=`<div class="study panel"><div class="stage"><img id="quizImg" class="hidden" src="${x.img}"></div><aside class="side"><h2>Quiz relámpago</h2><p>¿A qué tema pertenece esta imagen?</p><div class="row">${topics.map(t=>`<button onclick="quizAns('${t.replaceAll("'","\\'")}','${x.topic.replaceAll("'","\\'")}')">${t}</button>`).join('')}</div><div class="answer" id="result">La imagen está borrosa hasta que respondas.</div><button onclick="renderQuiz()">Otra pregunta</button></aside></div>`}
window.quizAns=(a,b)=>{let ok=a===b; state[ok?'ok':'bad']=(state[ok?'ok':'bad']||0)+1; save(); $('quizImg').classList.remove('hidden'); $('result').innerHTML=ok?`<b class="good">Correcto.</b> ${b}`:`<b class="bad">Casi.</b> Era: ${b}`}
window.mark=(good)=>{state[good?'ok':'bad']=(state[good?'ok':'bad']||0)+1; save(); next()}
window.next=()=>{current++; renderStudy()}; window.prev=()=>{current--; renderStudy()}; window.zoomImg=f=>{zoom*=f; $('big').style.transform=`scale(${zoom})`}
['search','topic','mode'].forEach(id=>$(id).addEventListener('input',()=>{current=0;render()})); $('shuffle').onclick=()=>{order.sort(()=>Math.random()-.5);current=0;render()}; render();
</script>
</body></html>
